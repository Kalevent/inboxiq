# Phoenix UI - OpenTelemetry Trace Viewer
# Open-source trace visualization and AI observability platform
# https://github.com/Arize-ai/phoenix

---
# Service - Exposes Phoenix UI and OTLP receiver
apiVersion: v1
kind: Service
metadata:
  name: phoenix
  namespace: kaley
  labels:
    app: phoenix
    component: observability
spec:
  selector:
    app: phoenix
  ports:
    # HTTP UI (web interface)
    - name: http
      port: 6006
      targetPort: 6006
      protocol: TCP
    # OTLP gRPC receiver (for OTel Collector)
    - name: grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
  type: ClusterIP  # Internal only (use Ingress for external access)

---
# Deployment - Phoenix application
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phoenix
  namespace: kaley
  labels:
    app: phoenix
    component: observability
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: phoenix
  template:
    metadata:
      labels:
        app: phoenix
        component: observability
    spec:
      containers:
        - name: phoenix
          image: arizephoenix/phoenix:version-13.0.2
          imagePullPolicy: IfNotPresent

          ports:
            # HTTP UI
            - containerPort: 6006
              name: http
              protocol: TCP
            # OTLP gRPC receiver
            - containerPort: 4317
              name: grpc
              protocol: TCP

          env:
            # Phoenix configuration
            - name: PHOENIX_PORT
              value: "6006"
            - name: PHOENIX_GRPC_PORT
              value: "4317"

            # Database configuration — PostgreSQL (existing RDS, phoenix schema)
            - name: PHOENIX_SQL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: inboxiq-env
                  key: PHOENIX_DATABASE_URL
            - name: PHOENIX_SQL_DATABASE_SCHEMA
              value: phoenix

            # Authentication — restrict Phoenix UI to authorised users only
            - name: PHOENIX_ENABLE_AUTH
              value: "true"
            - name: PHOENIX_SECRET
              valueFrom:
                secretKeyRef:
                  name: inboxiq-env
                  key: PHOENIX_SECRET

            # Logging
            - name: PHOENIX_LOG_LEVEL
              value: info

            # Data retention (prevent storage bloat)
            - name: PHOENIX_TRACE_DATASET_TTL_HOURS
              value: "168"  # Keep traces for 7 days (168 hours)
            - name: PHOENIX_CLEANUP_INTERVAL_HOURS
              value: "24"   # Run cleanup daily

            # CORS (if accessing Phoenix from different domain)
            # - name: PHOENIX_ENABLE_CORS
            #   value: "true"

          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "250m"

          # startupProbe gives Phoenix up to 3 minutes to connect to PostgreSQL and run migrations
          # before liveness takes over.
          startupProbe:
            httpGet:
              path: /
              port: 6006
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18  # 18 × 10s = 3 min max startup window

          # Liveness probe - restart if Phoenix becomes unhealthy after startup
          livenessProbe:
            httpGet:
              path: /
              port: 6006
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          # Readiness probe - only route traffic when ready
          readinessProbe:
            httpGet:
              path: /
              port: 6006
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

---
# StorageClass using the EBS CSI driver (replaces deprecated kubernetes.io/aws-ebs)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ebs-gp2-csi
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
parameters:
  type: gp2
  fsType: ext4

---
# PersistentVolumeClaim - Storage for Phoenix data (SQLite DB, logs)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: phoenix-pvc
  namespace: kaley
  labels:
    app: phoenix
    component: observability
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ebs-gp2-csi
  resources:
    requests:
      storage: 10Gi

