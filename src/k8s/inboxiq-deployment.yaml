apiVersion: apps/v1
kind: Deployment
metadata:
  name: inboxiq
  namespace: kaley
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inboxiq
  template:
    metadata:
      labels:
        app: inboxiq
    spec:
      containers:
        - name: inboxiq
          image: 094985084741.dkr.ecr.us-west-2.amazonaws.com/inboxiq:${TAG_VALUE}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: APP_ENV
              value: "production"
          envFrom:
            - secretRef:
                name: inboxiq-env
            - configMapRef:
                name: inboxiq-config
          volumeMounts:
            - name: gsc-credentials
              mountPath: /usr/src/gsc-service-account.json
              subPath: gsc-service-account.json
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: gsc-credentials
          secret:
            secretName: gsc-credentials
            optional: true
