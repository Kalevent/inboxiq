apiVersion: apps/v1
kind: Deployment
metadata:
  name: inboxiq
  namespace: kaley
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0  # Never take down old pods until new ones are ready
      maxSurge: 1  # Allow 1 extra pod during rollout
  selector:
    matchLabels:
      app: inboxiq
  template:
    metadata:
      labels:
        app: inboxiq
    spec:
      containers:
        - name: inboxiq
          image: 094985084741.dkr.ecr.us-west-2.amazonaws.com/inboxiq:${TAG_VALUE}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: APP_ENV
              value: "production"
            - name: SEARXNG_URL
              value: "http://searxng:8000"

            # OpenTelemetry configuration
            - name: OTEL_ENABLED
              value: "false"  # Disabled until new image is built
            - name: OTEL_SERVICE_NAME
              value: "inboxiq-app"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://localhost:4317"  # OTel Collector sidecar
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_traceidratio"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1.0"  # 100% sampling (adjust to 0.1 for 10% in production)
            - name: ENVIRONMENT
              value: "production"
            - name: K8S_CLUSTER_NAME
              value: "inboxiq-prod"

          envFrom:
            - secretRef:
                name: inboxiq-env
            - configMapRef:
                name: inboxiq-config
          volumeMounts:
            - name: gsc-credentials
              mountPath: /usr/src/gsc-service-account.json
              subPath: gsc-service-account.json
              readOnly: true
          # Health checks - critical for automatic rollback
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

        # OTel Collector sidecar - DISABLED until new image is built
        # Uncomment after: 1) Building image with OTel packages, 2) Updating app.py to init OTel

      volumes:
        - name: gsc-credentials
          secret:
            secretName: gsc-credentials
            optional: true
        # - name: otel-collector-config  # Re-enable with sidecar
        #   configMap:
        #     name: otel-collector-config
