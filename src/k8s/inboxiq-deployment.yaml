apiVersion: apps/v1
kind: Deployment
metadata:
  name: inboxiq
  namespace: kaley
spec:
  replicas: 1  # Can increase after memory optimization is confirmed stable
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0  # Never allow zero pods (zero-downtime)
      maxSurge: 1  # Create new pod first, then terminate old one
  selector:
    matchLabels:
      app: inboxiq
  template:
    metadata:
      labels:
        app: inboxiq
    spec:
      priorityClassName: inboxiq-high
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: inboxiq
                topologyKey: kubernetes.io/hostname
      containers:
        - name: inboxiq
          image: 094985084741.dkr.ecr.us-west-2.amazonaws.com/inboxiq:20260215-144250-otel-fix
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: APP_ENV
              value: "production"
            - name: SEARXNG_URL
              value: "http://searxng:8000"

            # OpenTelemetry configuration
            - name: OTEL_ENABLED
              value: "true"  # Enabled - OTel libraries installed
            - name: OTEL_SERVICE_NAME
              value: "inboxiq-app"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://localhost:4317"  # OTel Collector sidecar
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_traceidratio"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1.0"  # 100% sampling (adjust to 0.1 for 10% in production)
            - name: PROMETHEUS_METRICS_ENABLED
              value: "true"
            - name: ENVIRONMENT
              value: "production"
            - name: K8S_CLUSTER_NAME
              value: "inboxiq-prod"

          envFrom:
            - secretRef:
                name: inboxiq-env
            - configMapRef:
                name: inboxiq-config
          volumeMounts:
            - name: gsc-credentials
              mountPath: /usr/src/gsc-service-account.json
              subPath: gsc-service-account.json
              readOnly: true
          # Health checks - critical for automatic rollback
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi

        # OTel Collector sidecar - aggregates and forwards traces to Phoenix
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.96.0
          args:
            - "--config=/conf/otel-collector-config.yaml"
          ports:
            - containerPort: 4317  # OTLP gRPC receiver
              name: otlp-grpc
            - containerPort: 4318  # OTLP HTTP receiver
              name: otlp-http
            - containerPort: 8888  # Prometheus metrics
              name: metrics
            - containerPort: 13133  # Health check
              name: health
          volumeMounts:
            - name: otel-collector-config
              mountPath: /conf
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

      volumes:
        - name: gsc-credentials
          secret:
            secretName: gsc-credentials
            optional: true
        - name: otel-collector-config
          configMap:
            name: otel-collector-config
