apiVersion: apps/v1
kind: Deployment
metadata:
  name: inboxiq
  namespace: kaley
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0  # Never take down old pods until new ones are ready
      maxSurge: 1  # Allow 1 extra pod during rollout
  selector:
    matchLabels:
      app: inboxiq
  template:
    metadata:
      labels:
        app: inboxiq
    spec:
      containers:
        - name: inboxiq
          image: 094985084741.dkr.ecr.us-west-2.amazonaws.com/inboxiq:${TAG_VALUE}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: APP_ENV
              value: "production"
            - name: SEARXNG_URL
              value: "http://searxng:8000"

            # OpenTelemetry configuration
            - name: OTEL_ENABLED
              value: "false"  # Disabled until new image is built
            - name: OTEL_SERVICE_NAME
              value: "inboxiq-app"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://localhost:4317"  # OTel Collector sidecar
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_traceidratio"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1.0"  # 100% sampling (adjust to 0.1 for 10% in production)
            - name: ENVIRONMENT
              value: "production"
            - name: K8S_CLUSTER_NAME
              value: "inboxiq-prod"

          envFrom:
            - secretRef:
                name: inboxiq-env
            - configMapRef:
                name: inboxiq-config
          volumeMounts:
            - name: gsc-credentials
              mountPath: /usr/src/gsc-service-account.json
              subPath: gsc-service-account.json
              readOnly: true
          # Health checks - critical for automatic rollback
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

        # OTel Collector sidecar - receives traces from app, exports to Phoenix
        # COMMENTED OUT: Uncomment after building new image with OTel packages
        # - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.96.0
          imagePullPolicy: IfNotPresent
          args:
            - --config=/conf/otel-collector-config.yaml
          ports:
            - containerPort: 4317  # OTLP gRPC receiver
              name: otlp-grpc
              protocol: TCP
            - containerPort: 4318  # OTLP HTTP receiver
              name: otlp-http
              protocol: TCP
            - containerPort: 8888  # Prometheus metrics
              name: metrics
              protocol: TCP
            - containerPort: 13133  # Health check
              name: health
              protocol: TCP
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: K8S_CLUSTER_NAME
              value: "inboxiq-prod"
          volumeMounts:
            - name: otel-collector-config
              mountPath: /conf
          resources:
            requests:
              cpu: 50m      # Reduced for limited cluster
              memory: 64Mi  # Reduced for limited cluster
            limits:
              cpu: 100m
              memory: 128Mi
          # Health check
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2

      volumes:
        - name: gsc-credentials
          secret:
            secretName: gsc-credentials
            optional: true
        - name: otel-collector-config
          configMap:
            name: otel-collector-config
