apiVersion: batch/v1
kind: Job
metadata:
  name: inboxiq-migrate
  namespace: kaley
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: migrate
        image: 094985084741.dkr.ecr.us-west-2.amazonaws.com/inboxiq:20251222-193241-85a2caca9
        envFrom:
        - secretRef:
            name: inboxiq-env
        - configMapRef:
            name: inboxiq-config
        env:
        - name: APP_ENV
          value: "production"
        command: ["/bin/sh", "-c", "FLASK_APP=src.manage:app flask db upgrade -d src/migrations"]
        resources:
          requests:
            cpu: "50m"
            memory: "256Mi"
          limits:
            cpu: "250m"
            memory: "512Mi"
