apiVersion: apps/v1
kind: Deployment
metadata:
  name: inboxiq-celery-content-worker
  namespace: kaley
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: inboxiq-celery-content-worker
  template:
    metadata:
      labels:
        app: inboxiq-celery-content-worker
    spec:
      priorityClassName: inboxiq-low   # evicted before web pods and inbox workers under memory pressure
      containers:
        - name: content-worker
          image: 094985084741.dkr.ecr.eu-west-2.amazonaws.com/inboxiq:${TAG_VALUE}
          imagePullPolicy: IfNotPresent
          command: ["celery"]
          args: ["-A", "src.celery_inboxiq.celery", "worker", "--queues=content", "--loglevel=info", "-E", "--concurrency=1"]
          env:
            - name: APP_ENV
              value: "production"
            - name: SEARXNG_URL
              value: "http://searxng:8000"
            - name: HOME
              value: "/tmp"
            - name: DSPY_COMPILED_DIR
              value: "/dspy-artifacts"
            - name: OTEL_ENABLED
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: "inboxiq-celery-content-worker"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://localhost:4317"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_traceidratio"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            - name: ENVIRONMENT
              value: "production"
            - name: K8S_CLUSTER_NAME
              value: "inboxiq-prod"
          envFrom:
            - secretRef:
                name: inboxiq-env
            - configMapRef:
                name: inboxiq-config
          startupProbe:
            exec:
              command: ["python", "-c", "import os; os.kill(1, 0)"]
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["python", "-c", "import os; os.kill(1, 0)"]
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 2
          livenessProbe:
            exec:
              command: ["python", "-c", "import os; os.kill(1, 0)"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi   # content gen needs more RAM than email workers
            limits:
              cpu: 1000m
              memory: 2Gi    # hard cap — kernel kills this pod before touching web pods
          volumeMounts:
            - name: dspy-artifacts
              mountPath: /dspy-artifacts
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.96.0
          args:
            - "--config=/conf/otel-collector-config.yaml"
          ports:
            - containerPort: 4317
              name: otlp-grpc
          volumeMounts:
            - name: otel-collector-config
              mountPath: /conf
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: dspy-artifacts
          emptyDir: {}
        - name: otel-collector-config
          configMap:
            name: otel-collector-config
