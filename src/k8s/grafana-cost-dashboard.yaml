apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-cost-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  inboxiq-cost.json: |
    {
      "title": "InboxIQ — Compute Cost per Task",
      "uid": "inboxiq-cost-v1",
      "tags": ["inboxiq", "cost", "celery"],
      "timezone": "browser",
      "refresh": "1m",
      "time": { "from": "now-24h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Cluster Monthly Cost Estimate (EC2 only)",
          "type": "stat",
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 4 },
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 2,
              "thresholds": { "steps": [{"color": "green", "value": 0}, {"color": "yellow", "value": 150}, {"color": "red", "value": 300}] }
            }
          },
          "targets": [{
            "expr": "count(kube_node_info) * 0.0416 * 730",
            "legendFormat": "Monthly EC2 Cost"
          }]
        },
        {
          "id": 2,
          "title": "Cost per Hour (live)",
          "type": "stat",
          "gridPos": { "x": 6, "y": 0, "w": 6, "h": 4 },
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 4,
              "thresholds": { "steps": [{"color": "green", "value": 0}] }
            }
          },
          "targets": [{
            "expr": "count(kube_node_info) * 0.0416",
            "legendFormat": "$/hr"
          }]
        },
        {
          "id": 3,
          "title": "Cost per Second",
          "type": "stat",
          "gridPos": { "x": 12, "y": 0, "w": 6, "h": 4 },
          "options": { "colorMode": "value", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 8,
              "thresholds": { "steps": [{"color": "blue", "value": 0}] }
            }
          },
          "targets": [{
            "expr": "count(kube_node_info) * 0.0416 / 3600",
            "legendFormat": "$/sec"
          }]
        },
        {
          "id": 4,
          "title": "Active Nodes",
          "type": "stat",
          "gridPos": { "x": 18, "y": 0, "w": 6, "h": 4 },
          "options": { "colorMode": "value", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "steps": [{"color": "green", "value": 0}] }
            }
          },
          "targets": [{
            "expr": "count(kube_node_info)",
            "legendFormat": "Nodes"
          }]
        },
        {
          "id": 5,
          "title": "Task Executions per Minute (by task name)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 4, "w": 24, "h": 8 },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "targets": [{
            "expr": "sum by (name) (rate(celery_tasks_total{state=\"SUCCESS\"}[5m]) * 60)",
            "legendFormat": "{{ name }}"
          }]
        },
        {
          "id": 6,
          "title": "Avg Task Runtime (seconds) by Task",
          "type": "bargauge",
          "gridPos": { "x": 0, "y": 12, "w": 12, "h": 8 },
          "options": { "orientation": "horizontal", "reduceOptions": { "calcs": ["mean"] } },
          "fieldConfig": { "defaults": { "unit": "s", "decimals": 2 } },
          "targets": [{
            "expr": "sum by (name) (rate(celery_task_runtime_seconds_sum{state=\"SUCCESS\"}[1h])) / sum by (name) (rate(celery_task_runtime_seconds_count{state=\"SUCCESS\"}[1h]))",
            "legendFormat": "{{ name }}"
          }]
        },
        {
          "id": 7,
          "title": "Estimated Cost per Task Execution",
          "description": "avg_runtime_seconds × (cluster_cost_per_second). t3.medium = $0.0416/hr per node.",
          "type": "bargauge",
          "gridPos": { "x": 12, "y": 12, "w": 12, "h": 8 },
          "options": { "orientation": "horizontal", "reduceOptions": { "calcs": ["mean"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 6,
              "thresholds": { "steps": [{"color": "green", "value": 0}, {"color": "yellow", "value": 0.001}, {"color": "red", "value": 0.01}] }
            }
          },
          "targets": [{
            "expr": "(sum by (name) (rate(celery_task_runtime_seconds_sum{state=\"SUCCESS\"}[1h])) / sum by (name) (rate(celery_task_runtime_seconds_count{state=\"SUCCESS\"}[1h]))) * (count(kube_node_info) * 0.0416 / 3600)",
            "legendFormat": "{{ name }}"
          }]
        },
        {
          "id": 8,
          "title": "Task Failures",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 20, "w": 12, "h": 6 },
          "fieldConfig": { "defaults": { "unit": "short", "color": { "fixedColor": "red", "mode": "fixed" } } },
          "targets": [{
            "expr": "sum by (name) (rate(celery_tasks_total{state=\"FAILURE\"}[5m]) * 60)",
            "legendFormat": "{{ name }}"
          }]
        },
        {
          "id": 9,
          "title": "Cost per Namespace (CPU allocation weighted)",
          "type": "piechart",
          "gridPos": { "x": 12, "y": 20, "w": 12, "h": 6 },
          "options": { "pieType": "donut", "legend": { "displayMode": "table", "placement": "right" } },
          "fieldConfig": { "defaults": { "unit": "currencyUSD", "decimals": 2 } },
          "targets": [{
            "expr": "(sum by (namespace) (kube_pod_container_resource_requests{resource=\"cpu\"}) / sum(kube_node_status_allocatable{resource=\"cpu\"})) * count(kube_node_info) * 0.0416 * 730",
            "legendFormat": "{{ namespace }}"
          }]
        }
      ]
    }
