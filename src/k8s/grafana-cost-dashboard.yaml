apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-cost-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  inboxiq-cost.json: |
    {
      "title": "InboxIQ \u2014 Compute Cost per Task",
      "uid": "inboxiq-cost-v1",
      "tags": [
        "inboxiq",
        "cost",
        "celery"
      ],
      "timezone": "browser",
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Cluster Monthly Cost Estimate (EC2 only)",
          "type": "stat",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 2,
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "yellow",
                    "value": 150
                  },
                  {
                    "color": "red",
                    "value": 300
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "count(kube_node_info) * 0.0416 * 730",
              "legendFormat": "Monthly EC2 Cost"
            }
          ]
        },
        {
          "id": 2,
          "title": "Cost per Hour (live)",
          "type": "stat",
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 4,
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "count(kube_node_info) * 0.0416",
              "legendFormat": "$/hr"
            }
          ]
        },
        {
          "id": 3,
          "title": "Cost per Second",
          "type": "stat",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 8,
              "thresholds": {
                "steps": [
                  {
                    "color": "blue",
                    "value": 0
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "count(kube_node_info) * 0.0416 / 3600",
              "legendFormat": "$/sec"
            }
          ]
        },
        {
          "id": 4,
          "title": "Active Nodes",
          "type": "stat",
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "count(kube_node_info)",
              "legendFormat": "Nodes"
            }
          ]
        },
        {
          "id": 18,
          "title": "Worker Health",
          "description": "1 = worker is sending heartbeats. 0 = worker is down or exporter lost connection.",
          "type": "stat",
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 24,
            "h": 4
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "last"
              ]
            },
            "orientation": "horizontal",
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": {
                      "text": "UP",
                      "color": "green"
                    },
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": 0
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "celery_worker_up",
              "legendFormat": "{{ hostname }}"
            }
          ],
          "timeFrom": "5m"
        },
        {
          "id": 5,
          "title": "Task Executions per Minute (by task name)",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 24,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "targets": [
            {
              "expr": "sum by (name) (rate(celery_task_succeeded_total[5m]) * 60)",
              "legendFormat": "{{ name }}"
            }
          ]
        },
        {
          "id": 6,
          "title": "Avg Task Runtime (seconds) by Task",
          "type": "bargauge",
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "options": {
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "mean"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 2
            }
          },
          "targets": [
            {
              "expr": "sum by (name) (rate(celery_task_runtime_sum[5m])) / sum by (name) (rate(celery_task_runtime_count[5m]))",
              "legendFormat": "{{ name }}"
            }
          ]
        },
        {
          "id": 7,
          "title": "Estimated Cost per Task Execution",
          "description": "avg_runtime_seconds \u00d7 (cluster_cost_per_second). t3.medium = $0.0416/hr per node.",
          "type": "bargauge",
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "options": {
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "mean"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 6,
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "yellow",
                    "value": 0.001
                  },
                  {
                    "color": "red",
                    "value": 0.01
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "(sum by (name) (rate(celery_task_runtime_sum[5m])) / sum by (name) (rate(celery_task_runtime_count[5m]))) * (count(kube_node_info) * 0.0416 / 3600)",
              "legendFormat": "{{ name }}"
            }
          ]
        },
        {
          "id": 8,
          "title": "Task Failures",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 12,
            "h": 6
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "fixedColor": "red",
                "mode": "fixed"
              }
            }
          },
          "targets": [
            {
              "expr": "sum by (name) (rate(celery_task_failed_total[5m]) * 60)",
              "legendFormat": "{{ name }}"
            }
          ]
        },
        {
          "id": 9,
          "title": "Cost per Namespace (CPU allocation weighted)",
          "type": "piechart",
          "gridPos": {
            "x": 12,
            "y": 24,
            "w": 12,
            "h": 6
          },
          "options": {
            "pieType": "donut",
            "legend": {
              "displayMode": "table",
              "placement": "right"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 2
            }
          },
          "targets": [
            {
              "expr": "(sum by (namespace) (kube_pod_container_resource_requests{resource=\"cpu\"}) / sum(kube_node_status_allocatable{resource=\"cpu\"})) * count(kube_node_info) * 0.0416 * 730",
              "legendFormat": "{{ namespace }}"
            }
          ]
        },
        {
          "id": 15,
          "title": "Cost per Account \u2014 Last 24h",
          "description": "Sum of all task durations per account \u00d7 cluster cost/sec. Shows which accounts cost the most to serve.",
          "type": "bargauge",
          "gridPos": {
            "x": 0,
            "y": 30,
            "w": 24,
            "h": 8
          },
          "options": {
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "sum"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 6,
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "yellow",
                    "value": 0.001
                  },
                  {
                    "color": "red",
                    "value": 0.01
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "sum by (account_id) (increase(inboxiq_task_duration_seconds_sum[24h])) * (count(kube_node_info) * 0.0416 / 3600)",
              "legendFormat": "account {{ account_id }}"
            }
          ]
        },
        {
          "id": 16,
          "title": "Task Executions by Account (last 24h)",
          "type": "bargauge",
          "gridPos": {
            "x": 0,
            "y": 38,
            "w": 12,
            "h": 7
          },
          "options": {
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "sum"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0
            }
          },
          "targets": [
            {
              "expr": "sum by (account_id) (increase(inboxiq_task_total[24h]))",
              "legendFormat": "account {{ account_id }}"
            }
          ]
        },
        {
          "id": 17,
          "title": "Automation Workflow Cost by Account",
          "type": "bargauge",
          "gridPos": {
            "x": 12,
            "y": 38,
            "w": 12,
            "h": 7
          },
          "options": {
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "sum"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 6
            }
          },
          "targets": [
            {
              "expr": "sum by (account_id) (increase(inboxiq_task_duration_seconds_sum{task_name=\"automation.workflow\"}[24h])) * (count(kube_node_info) * 0.0416 / 3600)",
              "legendFormat": "account {{ account_id }}"
            }
          ]
        },
        {
          "id": 10,
          "title": "API Endpoint \u2014 Requests per Minute",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 30,
            "w": 24,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "targets": [
            {
              "expr": "sum by (endpoint) (rate(flask_http_request_duration_seconds_count{namespace=\"kaley\"}[5m]) * 60)",
              "legendFormat": "{{ endpoint }}"
            }
          ]
        },
        {
          "id": 11,
          "title": "Avg Response Time per Endpoint (ms)",
          "type": "bargauge",
          "gridPos": {
            "x": 0,
            "y": 37,
            "w": 12,
            "h": 8
          },
          "options": {
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "mean"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "decimals": 1
            }
          },
          "targets": [
            {
              "expr": "sum by (endpoint) (rate(flask_http_request_duration_seconds_sum{namespace=\"kaley\"}[1h])) / sum by (endpoint) (rate(flask_http_request_duration_seconds_count{namespace=\"kaley\"}[1h])) * 1000",
              "legendFormat": "{{ endpoint }}"
            }
          ]
        },
        {
          "id": 12,
          "title": "Estimated Cost per API Endpoint (per 1000 requests)",
          "description": "avg_latency_seconds \u00d7 (cluster_cost_per_second) \u00d7 1000 requests",
          "type": "bargauge",
          "gridPos": {
            "x": 12,
            "y": 37,
            "w": 12,
            "h": 8
          },
          "options": {
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "mean"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 6,
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "yellow",
                    "value": 0.01
                  },
                  {
                    "color": "red",
                    "value": 0.1
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "(sum by (endpoint) (rate(flask_http_request_duration_seconds_sum{namespace=\"kaley\"}[1h])) / sum by (endpoint) (rate(flask_http_request_duration_seconds_count{namespace=\"kaley\"}[1h]))) * (count(kube_node_info) * 0.0416 / 3600) * 1000",
              "legendFormat": "{{ endpoint }}"
            }
          ]
        },
        {
          "id": 13,
          "title": "HTTP Error Rate by Endpoint (5xx)",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 45,
            "w": 12,
            "h": 6
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "fixedColor": "red",
                "mode": "fixed"
              }
            }
          },
          "targets": [
            {
              "expr": "sum by (endpoint) (rate(flask_http_request_duration_seconds_count{namespace=\"kaley\", status=~\"5..\"}[5m]) * 60)",
              "legendFormat": "{{ endpoint }}"
            }
          ]
        },
        {
          "id": 14,
          "title": "Total Daily Cost Estimate",
          "type": "stat",
          "gridPos": {
            "x": 12,
            "y": 45,
            "w": 12,
            "h": 6
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 2,
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": 0
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "count(kube_node_info) * 0.0416 * 24",
              "legendFormat": "Daily EC2 Cost"
            }
          ]
        }
      ]
    }