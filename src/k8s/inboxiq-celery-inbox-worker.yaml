apiVersion: apps/v1
kind: Deployment
metadata:
  name: inboxiq-celery-inbox-worker
  namespace: kaley
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1  # Create new pod first for zero-downtime
      maxUnavailable: 0  # Never allow zero pods running
  selector:
    matchLabels:
      app: inboxiq-celery-inbox-worker
  template:
    metadata:
      labels:
        app: inboxiq-celery-inbox-worker
    spec:
      containers:
        - name: inbox-worker
          image: 094985084741.dkr.ecr.us-west-2.amazonaws.com/inboxiq:${TAG_VALUE}
          imagePullPolicy: IfNotPresent
          command: ["celery"]
          args: ["-A", "src.celery_inboxiq.celery", "worker", "--queues=inbox,billing,leads", "--loglevel=info"]
          env:
            - name: APP_ENV
              value: "production"
            - name: SEARXNG_URL
              value: "http://searxng:8000"

            # OpenTelemetry configuration (send traces directly to Phoenix)
            - name: OTEL_ENABLED
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: "inboxiq-celery-inbox-worker"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://phoenix.kaley.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_traceidratio"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1.0"
            - name: ENVIRONMENT
              value: "production"
            - name: K8S_CLUSTER_NAME
              value: "inboxiq-prod"
          envFrom:
            - secretRef:
                name: inboxiq-env
            - configMapRef:
                name: inboxiq-config
          # Liveness only — no readiness probe needed for a queue worker.
          # ps is available in python:3.11-slim; pgrep is NOT.
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "ps aux | grep -q '[c]elery'"
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
