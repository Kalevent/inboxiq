apiVersion: apps/v1
kind: Deployment
metadata:
  name: inboxiq-celery-inbox-worker
  namespace: kaley
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1  # Create new pod first for zero-downtime
      maxUnavailable: 0  # Never allow zero pods running
  selector:
    matchLabels:
      app: inboxiq-celery-inbox-worker
  template:
    metadata:
      labels:
        app: inboxiq-celery-inbox-worker
    spec:
      containers:
        - name: inbox-worker
          image: 094985084741.dkr.ecr.us-west-2.amazonaws.com/inboxiq:${TAG_VALUE}
          imagePullPolicy: IfNotPresent
          command: ["celery"]
          args: ["-A", "src.celery_inboxiq.celery", "worker", "--queues=inbox,billing,leads", "--loglevel=info"]
          env:
            - name: APP_ENV
              value: "production"
            - name: SEARXNG_URL
              value: "http://searxng:8000"
            - name: HOME
              value: "/tmp"
            - name: DSPY_COMPILED_DIR
              value: "/dspy-artifacts"

            # OpenTelemetry configuration (send traces directly to Phoenix)
            - name: OTEL_ENABLED
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: "inboxiq-celery-inbox-worker"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://phoenix.kaley.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_traceidratio"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1.0"
            - name: ENVIRONMENT
              value: "production"
            - name: K8S_CLUSTER_NAME
              value: "inboxiq-prod"
          envFrom:
            - secretRef:
                name: inboxiq-env
            - configMapRef:
                name: inboxiq-config
          # No liveness or readiness probes — python:3.11-slim has neither pgrep nor ps.
          # If Celery crashes the container exits (non-zero) and Kubernetes restarts it.
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: dspy-artifacts
              mountPath: /dspy-artifacts
      volumes:
        - name: dspy-artifacts
          persistentVolumeClaim:
            claimName: dspy-artifacts-pvc
