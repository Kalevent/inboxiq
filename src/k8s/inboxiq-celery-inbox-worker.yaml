apiVersion: apps/v1
kind: Deployment
metadata:
  name: inboxiq-celery-inbox-worker
  namespace: kaley
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1  # Allow 1 extra pod during rollout
      maxUnavailable: 0  # Never take down old pods until new ones are ready
  selector:
    matchLabels:
      app: inboxiq-celery-inbox-worker
  template:
    metadata:
      labels:
        app: inboxiq-celery-inbox-worker
    spec:
      containers:
        - name: inbox-worker
          image: 094985084741.dkr.ecr.us-west-2.amazonaws.com/inboxiq:${TAG_VALUE}
          imagePullPolicy: IfNotPresent
          command: ["celery"]
          args: ["-A", "src.celery_inboxiq.celery", "worker", "--queues=inbox,billing,leads", "--loglevel=info"]
          env:
            - name: APP_ENV
              value: "production"
            - name: SEARXNG_URL
              value: "http://searxng:8000"
          envFrom:
            - secretRef:
                name: inboxiq-env
            - configMapRef:
                name: inboxiq-config
          # Health check for Celery worker
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "celery -A src.celery_inboxiq.celery inspect ping -d celery@$HOSTNAME"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pgrep -f 'celery.*worker' > /dev/null"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
