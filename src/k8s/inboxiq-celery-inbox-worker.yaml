apiVersion: apps/v1
kind: Deployment
metadata:
  name: inboxiq-celery-inbox-worker
  namespace: kaley
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0  # Never kill old pod until new one passes readiness probe
      maxSurge: 1        # Bring new pod up first, then drain old
  selector:
    matchLabels:
      app: inboxiq-celery-inbox-worker
  template:
    metadata:
      labels:
        app: inboxiq-celery-inbox-worker
    spec:
      priorityClassName: inboxiq-high
      securityContext:
        runAsNonRoot: true
      containers:
        - name: inbox-worker
          image: 094985084741.dkr.ecr.eu-west-2.amazonaws.com/inboxiq:${TAG_VALUE}
          imagePullPolicy: IfNotPresent
          command: ["celery"]
          args: ["-A", "src.celery_inboxiq.celery", "worker", "--queues=inbox,billing,leads", "--loglevel=info", "-E"]
          env:
            - name: APP_ENV
              value: "production"
            - name: SEARXNG_URL
              value: "http://searxng:8000"
            - name: HOME
              value: "/tmp"
            - name: DSPY_COMPILED_DIR
              value: "/dspy-artifacts"

            # OpenTelemetry configuration (route through local collector sidecar)
            - name: OTEL_ENABLED
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: "inboxiq-celery-inbox-worker"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://localhost:4317"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_traceidratio"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            - name: ENVIRONMENT
              value: "production"
            - name: K8S_CLUSTER_NAME
              value: "inboxiq-prod"
          envFrom:
            - secretRef:
                name: inboxiq-env
            - configMapRef:
                name: inboxiq-config
          startupProbe:
            exec:
              command: ["python", "-c", "import os; os.kill(1, 0)"]
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30  # up to 5 minutes for heavy DSPy/OTel imports to load
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["python", "-c", "import os; os.kill(1, 0)"]
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 2
          livenessProbe:
            exec:
              command: ["python", "-c", "import os; os.kill(1, 0)"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 2Gi
          volumeMounts:
            - name: dspy-artifacts
              mountPath: /dspy-artifacts
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.96.0
          args:
            - "--config=/conf/otel-collector-config.yaml"
          ports:
            - containerPort: 4317
              name: otlp-grpc
          volumeMounts:
            - name: otel-collector-config
              mountPath: /conf
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: dspy-artifacts
          emptyDir: {}  # EBS PVC caused node-affinity scheduling failures; artifacts recompile on restart
        - name: otel-collector-config
          configMap:
            name: otel-collector-config
