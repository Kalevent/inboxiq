apiVersion: apps/v1
kind: Deployment
metadata:
  name: inboxiq-celery-inbox-worker
  namespace: kaley
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0       # Don't exceed current replica count (node memory is constrained)
      maxUnavailable: 1 # Terminate one old pod before creating replacement
  selector:
    matchLabels:
      app: inboxiq-celery-inbox-worker
  template:
    metadata:
      labels:
        app: inboxiq-celery-inbox-worker
    spec:
      priorityClassName: inboxiq-high
      containers:
        - name: inbox-worker
          image: 094985084741.dkr.ecr.us-west-2.amazonaws.com/inboxiq:${TAG_VALUE}
          imagePullPolicy: IfNotPresent
          command: ["celery"]
          args: ["-A", "src.celery_inboxiq.celery", "worker", "--queues=inbox,billing,leads", "--loglevel=info", "-E"]
          env:
            - name: APP_ENV
              value: "production"
            - name: SEARXNG_URL
              value: "http://searxng:8000"
            - name: HOME
              value: "/tmp"
            - name: DSPY_COMPILED_DIR
              value: "/dspy-artifacts"

            # OpenTelemetry configuration (send traces directly to Phoenix)
            - name: OTEL_ENABLED
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: "inboxiq-celery-inbox-worker"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://phoenix.kaley.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_traceidratio"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            - name: ENVIRONMENT
              value: "production"
            - name: K8S_CLUSTER_NAME
              value: "inboxiq-prod"
          envFrom:
            - secretRef:
                name: inboxiq-env
            - configMapRef:
                name: inboxiq-config
          livenessProbe:
            exec:
              command: ["python", "-c", "import os; os.kill(1, 0)"]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: dspy-artifacts
              mountPath: /dspy-artifacts
      volumes:
        - name: dspy-artifacts
          emptyDir: {}  # EBS PVC caused node-affinity scheduling failures; artifacts recompile on restart
