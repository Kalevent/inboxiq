# Horizontal Pod Autoscalers — scale pods before nodes saturate.
# Cluster Autoscaler then adds nodes when pods can't be scheduled.

# ── Flask web app ────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inboxiq-hpa
  namespace: kaley
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inboxiq
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60      # Scale up quickly under load
    scaleDown:
      stabilizationWindowSeconds: 300     # Wait 5 min before scaling down
---
# ── Celery inbox worker ──────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inboxiq-celery-inbox-worker-hpa
  namespace: kaley
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inboxiq-celery-inbox-worker
  minReplicas: 1
  maxReplicas: 1  # EBS PVC (dspy-artifacts-pvc) is ReadWriteOnce — only 1 node can mount it
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
