apiVersion: v1
kind: Secret
metadata:
  name: inboxiq-env
  namespace: kaley
type: Opaque
# NOTE: preferred workflow (keeps secrets out of git):
#   kubectl delete secret inboxiq-env -n kaley || true
#   kubectl create secret generic inboxiq-env --from-env-file=src/.env -n kaley
# The keys below are placeholders to document what must exist if you do apply this file.
stringData:
  SECRET_KEY: "replace-me"
  JWT_SECRET_KEY: "replace-me"
  DATABASE_URL: "postgresql://user:pass@db-host:5432/inboxiq"
  REDIS_URL: "redis://:password@redis-host:6379/0"
  CELERY_BROKER_URL: "redis://:password@redis-host:6379/0"
  CELERY_RESULT_BACKEND: "redis://:password@redis-host:6379/1"
  REDIS_PASSWORD: "replace-me"
  OPENAI_API_KEY: "replace-me"
