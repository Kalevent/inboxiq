apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-exporter
  namespace: kaley
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-exporter
  template:
    metadata:
      labels:
        app: celery-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9808"
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: celery-exporter
          image: danihodovic/celery-exporter:0.10.5
          args:
            - "--broker-url=$(CELERY_BROKER_URL)"
          env:
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: inboxiq-env
                  key: CELERY_BROKER_URL
          ports:
            - name: metrics
              containerPort: 9808
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          # startupProbe gives the exporter up to 5 min to receive its first
          # worker-heartbeat event before the livenessProbe takes over.
          startupProbe:
            exec:
              command:
                - python3
                - -c
                - |
                  import urllib.request, sys
                  body = urllib.request.urlopen('http://localhost:9808/metrics', timeout=5).read().decode()
                  sys.exit(0 if 'celery_worker_up' in body else 1)
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10  # 10 × 30s = 5 min window on startup
          livenessProbe:
            # Once started, restart if celery_worker_up disappears (stale event stream).
            exec:
              command:
                - python3
                - -c
                - |
                  import urllib.request, sys
                  body = urllib.request.urlopen('http://localhost:9808/metrics', timeout=5).read().decode()
                  sys.exit(0 if 'celery_worker_up' in body else 1)
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3  # 3 × 60s = 3 min before restart
---
apiVersion: v1
kind: Service
metadata:
  name: celery-exporter
  namespace: kaley
  labels:
    app: celery-exporter
spec:
  selector:
    app: celery-exporter
  ports:
    - name: metrics
      port: 9808
      targetPort: 9808
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: celery-exporter
  namespace: kaley
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: celery-exporter
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
