---
# Default block storage for zonal stateful workloads that still need EBS.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ebs-gp3-csi
provisioner: ebs.csi.aws.com
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
parameters:
  type: gp3
  fsType: ext4

---
# Shared storage for low-write observability components that should survive node loss
# without getting stuck behind an orphaned EBS VolumeAttachment.
# Populate EFS_FILE_SYSTEM_ID from:
#   terraform -chdir=infra/environments/production output -raw observability_efs_file_system_id
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: efs-observability
provisioner: efs.csi.aws.com
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  provisioningMode: efs-ap
  fileSystemId: ${EFS_FILE_SYSTEM_ID}
  basePath: /dynamic-provisioning
  directoryPerms: "770"
