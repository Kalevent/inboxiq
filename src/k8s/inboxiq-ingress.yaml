apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inboxiq
  namespace: kaley
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-west-2:094985084741:certificate/ee7fc181-8210-42c4-9697-99f456a1358d
spec:
  ingressClassName: alb
  rules:
    - host: kalevent.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: inboxiq
                port:
                  number: 80
    - host: api.kalevent.com
      http:
        paths:
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: inboxiq
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: inboxiq
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: inboxiq
                port:
                  number: 80
    - host: phoenix.kalevent.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: phoenix
                port:
                  number: 6006
