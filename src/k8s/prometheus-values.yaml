# kube-prometheus-stack values for InboxIQ cluster
# Installs: Prometheus, Grafana, Alertmanager, kube-state-metrics, node-exporter

grafana:
  enabled: true
  adminPassword: "InboxIQ-Grafana-2026!"
  priorityClassName: inboxiq-low
  initChownData:
    enabled: false
  podSecurityContext:
    fsGroup: 472
    runAsGroup: 472
    runAsUser: 472
  service:
    type: ClusterIP
    port: 80
  # Keep Grafana off single-attach EBS so node loss does not strand the UI.
  persistence:
    enabled: true
    storageClassName: efs-observability
    accessModes:
      - ReadWriteMany
    size: 5Gi
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 200m
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
      label: grafana_dashboard
      labelValue: "1"
  grafana.ini:
    server:
      root_url: "https://grafana.kalevent.com"
      domain: "grafana.kalevent.com"
    users:
      allow_sign_up: false
      allow_org_create: false
    auth:
      disable_login_form: false
      password_hint: ""
    smtp:
      enabled: false

prometheus:
  prometheusSpec:
    priorityClassName: inboxiq-low
    retention: 7d
    retentionSize: 8GB
    walCompression: true
    scrapeInterval: 30s
    evaluationInterval: 30s
    # Watch ServiceMonitors in all namespaces (celery-exporter + inboxiq-flask are in kaley namespace)
    serviceMonitorNamespaceSelector: {}
    serviceMonitorSelector:
      matchLabels:
        release: kube-prometheus-stack
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: ebs-gp3-csi
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        memory: 64Mi
        cpu: 20m
      limits:
        memory: 128Mi
        cpu: 100m
    # Mount secret as files (for auth_password_file) and as env var (for auth_username)
    secrets:
      - alertmanager-smtp-creds
    env:
      - name: SMTP_AUTH_USERNAME
        valueFrom:
          secretKeyRef:
            name: alertmanager-smtp-creds
            key: smtp_auth_username
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'email-security'
      routes:
        - matchers:
            - alertname =~ "InfoInhibitor|Watchdog"
          receiver: 'null'
    receivers:
      - name: 'null'  # silences Watchdog heartbeat alert injected by kube-prometheus-stack
      - name: 'email-security'
        email_configs:
          - to: 'security@kalevent.com'
            from: 'noreply@kalevent.com'
            smarthost: 'email-smtp.us-west-2.amazonaws.com:587'
            require_tls: true
            auth_username: '$SMTP_AUTH_USERNAME'
            auth_password_file: '/etc/alertmanager/secrets/alertmanager-smtp-creds/smtp_auth_password'
            headers:
              Subject: '{{ template "inboxiq.email.subject" . }}'
            html: '{{ template "inboxiq.email.html" . }}'
  templateFiles:
    inboxiq.tmpl: |
      {{ define "inboxiq.email.subject" -}}
      {{ if eq .Status "firing" -}}[ALERT] {{ else -}}[RESOLVED] {{ end -}}
      {{ with index .Alerts 0 }}{{ .Annotations.summary }}{{ end }}
      {{- end }}

      {{ define "inboxiq.email.html" -}}
      <!DOCTYPE html>
      <html>
      <body style="font-family:Arial,sans-serif;max-width:600px;margin:0 auto;padding:20px;color:#1a1a1a;">

      {{ if eq .Status "firing" -}}
      <div style="border-left:4px solid #c0392b;background:#fdf2f2;padding:16px;margin-bottom:24px;">
        <p style="margin:0;font-size:16px;font-weight:bold;color:#c0392b;">Infrastructure Alert — Action May Be Required</p>
      </div>
      {{ else -}}
      <div style="border-left:4px solid #27ae60;background:#f2fdf5;padding:16px;margin-bottom:24px;">
        <p style="margin:0;font-size:16px;font-weight:bold;color:#27ae60;">Alert Resolved</p>
      </div>
      {{ end -}}

      {{ range .Alerts -}}
      <table style="width:100%;border-collapse:collapse;margin-bottom:20px;font-size:14px;">
        <tr style="background:#f5f5f5;">
          <td style="padding:10px;font-weight:bold;width:130px;">What happened</td>
          <td style="padding:10px;">{{ .Annotations.summary }}</td>
        </tr>
        <tr>
          <td style="padding:10px;font-weight:bold;">Details</td>
          <td style="padding:10px;">{{ .Annotations.description }}</td>
        </tr>
        {{ if .Labels.pod -}}
        <tr style="background:#f5f5f5;">
          <td style="padding:10px;font-weight:bold;">Pod</td>
          <td style="padding:10px;font-family:monospace;">{{ .Labels.pod }}</td>
        </tr>
        {{ end -}}
        {{ if .Labels.node -}}
        <tr style="background:#f5f5f5;">
          <td style="padding:10px;font-weight:bold;">Node</td>
          <td style="padding:10px;font-family:monospace;">{{ .Labels.node }}</td>
        </tr>
        {{ end -}}
        <tr>
          <td style="padding:10px;font-weight:bold;">Namespace</td>
          <td style="padding:10px;">{{ .Labels.namespace }}</td>
        </tr>
        <tr style="background:#f5f5f5;">
          <td style="padding:10px;font-weight:bold;">Severity</td>
          <td style="padding:10px;">{{ toUpper .Labels.severity }}</td>
        </tr>
        <tr>
          <td style="padding:10px;font-weight:bold;">Time</td>
          <td style="padding:10px;">{{ .StartsAt.Format "02 Jan 2006 15:04 UTC" }}</td>
        </tr>
        {{ if match "OOMKill" .Labels.alertname -}}
        <tr style="background:#fffbf0;">
          <td style="padding:10px;font-weight:bold;">What to do</td>
          <td style="padding:10px;">The pod will restart automatically. If this repeats, the memory limit needs to be raised in the pod deployment YAML.</td>
        </tr>
        {{ else if match "Restarting" .Labels.alertname -}}
        <tr style="background:#fffbf0;">
          <td style="padding:10px;font-weight:bold;">What to do</td>
          <td style="padding:10px;">Check pod logs: kubectl logs &lt;pod-name&gt; -n {{ .Labels.namespace }} --previous</td>
        </tr>
        {{ else if match "Memory" .Labels.alertname -}}
        <tr style="background:#fffbf0;">
          <td style="padding:10px;font-weight:bold;">What to do</td>
          <td style="padding:10px;">Memory is approaching its limit. Monitor closely — an OOMKill may follow if usage does not drop.</td>
        </tr>
        {{ else if match "Node" .Labels.alertname -}}
        <tr style="background:#fffbf0;">
          <td style="padding:10px;font-weight:bold;">What to do</td>
          <td style="padding:10px;">Node memory is critically high. The cluster autoscaler may add a node. Check for a pod with a memory leak.</td>
        </tr>
        {{ end -}}
      </table>
      {{ end -}}

      <p style="font-size:12px;color:#888;margin-top:32px;">
        Sent by InboxIQ infrastructure monitoring &mdash;
        <a href="{{ .ExternalURL }}" style="color:#888;">View in Alertmanager</a>
      </p>
      </body>
      </html>
      {{- end }}

# Critical alerts — OOMKill, pod restarts, memory pressure
additionalPrometheusRulesMap:
  inboxiq-alerts:
    groups:
      - name: pod-health
        rules:
          - alert: PodOOMKilled
            expr: kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "Pod OOMKilled: {{ $labels.pod }}"
              description: "{{ $labels.pod }} was OOMKilled. Increase memory limit."

          - alert: PodRestartingFrequently
            expr: rate(kube_pod_container_status_restarts_total[15m]) > 0.1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Pod restarting: {{ $labels.pod }}"
              description: "{{ $labels.pod }} has restarted more than once in 15 minutes."

          - alert: ContainerMemoryHighUsage
            expr: |
              (container_memory_working_set_bytes{namespace="kaley", container!=""} /
               container_spec_memory_limit_bytes{namespace="kaley", container!=""}) > 0.80
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High memory: {{ $labels.pod }}/{{ $labels.container }}"
              description: "Container is using >80% of its memory limit. Risk of OOMKill."

          - alert: NodeMemoryHighUsage
            expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.85
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Node memory critical: {{ $labels.node }}"
              description: "Node is using >85% memory. Add a node or reduce workloads."

kube-state-metrics:
  resources:
    requests:
      memory: 32Mi
      cpu: 10m
    limits:
      memory: 64Mi
      cpu: 50m

prometheus-node-exporter:
  resources:
    requests:
      memory: 32Mi
      cpu: 10m
    limits:
      memory: 64Mi
      cpu: 50m
