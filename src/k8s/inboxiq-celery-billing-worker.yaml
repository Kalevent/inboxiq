apiVersion: apps/v1
kind: Deployment
metadata:
  name: inboxiq-celery-billing-worker
  namespace: kaley
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inboxiq-celery-billing-worker
  template:
    metadata:
      labels:
        app: inboxiq-celery-billing-worker
    spec:
      priorityClassName: inboxiq-high
      containers:
        - name: billing-worker
          image: 094985084741.dkr.ecr.us-west-2.amazonaws.com/inboxiq:${TAG_VALUE}
          imagePullPolicy: IfNotPresent
          command: ["celery"]
          args: ["-A", "src.celery_inboxiq.celery", "worker", "-Q", "billing,inbox", "-l", "info", "-E"]
          env:
            - name: APP_ENV
              value: "production"

            # OpenTelemetry configuration (send traces directly to Phoenix)
            - name: OTEL_ENABLED
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: "inboxiq-celery-billing-worker"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://phoenix.kaley.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_traceidratio"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            - name: ENVIRONMENT
              value: "production"
            - name: K8S_CLUSTER_NAME
              value: "inboxiq-prod"
          envFrom:
            - secretRef:
                name: inboxiq-env
            - configMapRef:
                name: inboxiq-config
          livenessProbe:
            exec:
              command: ["python", "-c", "import os; os.kill(1, 0)"]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              cpu: 200m
              memory: 2Gi
