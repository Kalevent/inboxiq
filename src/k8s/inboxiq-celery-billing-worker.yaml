apiVersion: apps/v1
kind: Deployment
metadata:
  name: inboxiq-celery-billing-worker
  namespace: kaley
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inboxiq-celery-billing-worker
  template:
    metadata:
      labels:
        app: inboxiq-celery-billing-worker
    spec:
      containers:
        - name: billing-worker
          image: 094985084741.dkr.ecr.us-west-2.amazonaws.com/inboxiq:${TAG_VALUE}
          imagePullPolicy: IfNotPresent
          command: ["celery"]
          args: ["-A", "src.celery_inboxiq.celery", "worker", "-Q", "billing,inbox", "-l", "info", "-E"]
          env:
            - name: APP_ENV
              value: "production"

            # OpenTelemetry configuration (send traces directly to Phoenix)
            - name: OTEL_ENABLED
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: "inboxiq-celery-billing-worker"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://phoenix.kaley.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_traceidratio"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1.0"
            - name: ENVIRONMENT
              value: "production"
            - name: K8S_CLUSTER_NAME
              value: "inboxiq-prod"
          envFrom:
            - secretRef:
                name: inboxiq-env
            - configMapRef:
                name: inboxiq-config
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "celery -A src.celery_inboxiq.celery inspect ping -d celery@$HOSTNAME --timeout 5 2>&1 | grep -q OK"
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
