<div class="max-w-6xl mx-auto px-4 pb-4 flex items-center justify-end">
  <div class="flex items-center gap-3 text-slate-400">
    <button
      id="openFeedbackModal"
      type="button"
      class="inline-flex items-center gap-2 rounded-lg border border-slate-800 bg-slate-900/70 px-3 py-1.5 text-xs font-semibold text-slate-100 hover:border-indigo-400 hover:text-white"
    >
      🗣️ Send feedback
    </button>
    <span class="hidden text-xs" id="footerFeedbackStatusLink"></span>
  </div>
</div>

<div
  id="footerFeedbackModal"
  class="hidden fixed inset-0 z-[9999] bg-slate-950/80 backdrop-blur-sm flex items-center justify-center px-4"
  role="dialog"
  aria-modal="true"
  aria-hidden="true"
  style="display: none;"
>
  <div class="w-full max-w-2xl rounded-2xl border border-slate-800 bg-slate-950 shadow-2xl shadow-slate-950/60">
    <div class="flex items-center justify-between px-4 py-3 border-b border-slate-800">
      <div>
        <div class="text-sm font-semibold text-slate-100 leading-tight">Have feedback?</div>
        <p class="text-xs text-slate-400 leading-snug">
          Tell us what’s working, what isn’t, or what’s missing. This routes through the same InboxIQ brain instead of disappearing in email.
        </p>
      </div>
      <button id="closeFeedbackModal" type="button" class="text-slate-400 hover:text-slate-100 text-lg leading-none">×</button>
    </div>

    <form id="footerFeedbackForm" class="p-4 space-y-3">
      <div class="space-y-2">
        <label for="footerFeedbackMessage" class="text-[11px] uppercase tracking-wide text-slate-400">Message</label>
        <textarea
          id="footerFeedbackMessage"
          rows="4"
          class="w-full rounded-xl border border-slate-800 bg-slate-900/70 px-3 py-3 text-sm text-slate-100 placeholder:text-slate-500 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-400/30"
          placeholder="What should we improve? What’s confusing?"
        ></textarea>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div class="space-y-2 sm:col-span-1">
          <label for="footerFeedbackRating" class="text-[11px] uppercase tracking-wide text-slate-400">Urgency</label>
          <select
            id="footerFeedbackRating"
            class="w-full rounded-xl border border-slate-800 bg-slate-900/70 px-3 py-3 text-sm text-slate-100 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-400/30"
          >
            <option value="5">🚨 Critical</option>
            <option value="4">⚠️ Important</option>
            <option value="3" selected>👍 Helpful</option>
            <option value="2">🙂 Nice to have</option>
            <option value="1">👀 Just sharing</option>
          </select>
        </div>

        <div class="sm:col-span-2 space-y-2">
          <label for="footerFeedbackContext" class="text-[11px] uppercase tracking-wide text-slate-400">Context (optional)</label>
          <input
            id="footerFeedbackContext"
            type="text"
            class="w-full rounded-xl border border-slate-800 bg-slate-900/70 px-3 py-2 text-sm text-slate-100 placeholder:text-slate-500 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-400/30"
            placeholder="e.g., Page: Dashboard, Browser: Chrome, Plan: Pro"
          />
        </div>
      </div>

      <div class="flex items-center gap-3">
        <button
          id="footerFeedbackSubmit"
          type="submit"
          class="inline-flex items-center gap-2 rounded-xl btn-primary px-4 py-2 text-sm font-semibold text-white shadow shadow-indigo-500/30"
        >
          Send feedback →
        </button>
        <span id="footerFeedbackStatus" class="text-xs text-slate-300 hidden"></span>
      </div>
    </form>
  </div>
</div>
