                    <label class="text-xs text-slate-400">Account ID</label>

                    <input id="testimonialUser" type="number" class="mt-1 w-full rounded-xl border border-slate-700 bg-slate-900/70 px-3 py-2 text-sm text-slate-100" placeholder="e.g. 42" />
                  </div>
                  <div>
                    <label class="text-xs text-slate-400">Send to email (optional)</label>
                    <input id="testimonialEmail" type="email" class="mt-1 w-full rounded-xl border border-slate-700 bg-slate-900/70 px-3 py-2 text-sm text-slate-100" placeholder="you@company.com" />

                  <button id="testimonialButton" type="submit" class="inline-flex justify-center items-center rounded-xl bg-indigo-500 hover:bg-indigo-400 px-4 py-2.5 text-sm font-semibold text-white transition disabled:opacity-60">

              </div>

              <!-- Stats Grid -->
              <div class="grid md:grid-cols-2 gap-4">
