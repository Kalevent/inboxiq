name: semgrep

on:
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan every Monday at 03:00 UTC
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  semgrep:
    name: Scan Python (Semgrep)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Run Semgrep
        run: |
          pip install semgrep==1.155.0 --quiet
          semgrep scan \
            --config "p/python" \
            --config "p/flask" \
            --config "p/secrets" \
            --config "p/owasp-top-ten" \
            --config ".semgrep/rules.yml" \
            --severity ERROR \
            --error \
            --quiet \
            src/
