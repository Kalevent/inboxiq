name: semgrep

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
  schedule:
    # Weekly scan every Monday at 03:00 UTC
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  semgrep:
    name: Scan Python (Semgrep)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          pip install semgrep --quiet
          semgrep scan \
            --config "p/python" \
            --config "p/flask" \
            --config "p/secrets" \
            --config "p/owasp-top-ten" \
            --config ".semgrep/rules.yml" \
            --error \
            --quiet \
            src/
