name: ci-cd

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/inbox-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/inbox-ci.yml'
      - 'renovate.json'
  workflow_dispatch:
    inputs:
      run_migrations:
        description: "Force run migrations"
        required: false
        default: "false"

concurrency:
  group: ${{ github.event_name == 'push' && 'inbox-deploy' || format('inbox-pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  ECR_REPO: ${{ secrets.ECR_REPO }}
  EKS_CLUSTER: ${{ secrets.EKS_CLUSTER }}
  KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
  HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}

permissions:
  id-token: write
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for secret scan)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.18.4"
          GITLEAKS_SHA256="ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xz -f gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          rm gitleaks.tar.gz

      - name: Scan for secrets
        run: ./gitleaks detect --source . --redact --exit-code 1

  validate-deps:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: '3.14'

      - name: Verify lockfile is installable
        run: |
          # --no-deps skips resolution (the lock file is fully pinned by design).
          # This catches missing/yanked packages without hitting pip's depth limit.
          pip install --quiet --no-deps -r src/requirements-inboxiq.lock.txt
          echo "All dependencies resolved successfully"

  build-and-deploy:
    needs: [secret-scan]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Detect migration changes
        id: migrations
        run: |
          set -e
          CHANGED=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.run_migrations }}" = "true" ]; then
              CHANGED=true
            fi
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            DIFF=$(git diff --name-only "$BASE" "$HEAD" -- src/migrations/versions || true)
            if [ -n "$DIFF" ]; then
              CHANGED=true
            fi
          else
            git fetch --no-tags --prune --depth=2 origin "${{ github.ref }}"
            DIFF=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- src/migrations/versions || true)
            if [ -n "$DIFF" ]; then
              CHANGED=true
            fi
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_INBOX }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${ECR_REGISTRY}"

      - name: Build and push image
        run: |
          TAG="$(date +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"
          IMAGE="${ECR_REGISTRY}/${ECR_REPO}:${TAG}"
          docker buildx build \
            --platform linux/amd64 \
            -f src/Dockerfile.inboxiq \
            -t "${IMAGE}" \
            --push \
            .
          # Optional additional tag for convenience
          docker buildx imagetools create -t "${ECR_REGISTRY}/${ECR_REPO}:inbox" "${IMAGE}"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Install Trivy
        run: |
          TRIVY_VERSION="0.69.3"
          TRIVY_SHA256="1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75"
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            -o trivy.tar.gz
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xz -f trivy.tar.gz trivy
          chmod +x trivy
          rm trivy.tar.gz

      - name: Scan image with Trivy
        run: |
          ./trivy image \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "${ECR_REGISTRY}/${ECR_REPO}:${TAG}"

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d  # v5

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name "${EKS_CLUSTER}" --region "${AWS_REGION}"

      - name: Run migrations
        if: steps.migrations.outputs.changed == 'true'
        env:
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ env.TAG }}
        run: |
          set -e
          MIGRATE_NAME="inboxiq-migrate-${TAG}"
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: ${MIGRATE_NAME}
            namespace: ${KUBE_NAMESPACE}
          spec:
            restartPolicy: Never
            containers:
              - name: migrate
                image: ${IMAGE}
                command: ["/bin/sh","-lc"]
                args: ["export FLASK_APP=src.manage:app; /usr/src/.venv/bin/python -m flask db upgrade -d src/migrations"]
                env:
                  - name: APP_ENV
                    value: "production"
                  - name: DATABASE_URL
                    valueFrom:
                      secretKeyRef:
                        name: inboxiq-env
                        key: DATABASE_URL
                envFrom:
                  - secretRef:
                      name: inboxiq-env
                  - configMapRef:
                      name: inboxiq-config
                resources:
                  requests:
                    memory: "512Mi"
                    cpu: "100m"
                  limits:
                    memory: "1Gi"
                    cpu: "500m"
          EOF
          if ! kubectl wait --for=jsonpath='{.status.phase}'=Succeeded pod/${MIGRATE_NAME} -n "${KUBE_NAMESPACE}" --timeout=600s; then
            kubectl logs -n "${KUBE_NAMESPACE}" pod/${MIGRATE_NAME} || true
            kubectl describe pod -n "${KUBE_NAMESPACE}" ${MIGRATE_NAME} || true
            kubectl delete pod/${MIGRATE_NAME} -n "${KUBE_NAMESPACE}" --ignore-not-found
            exit 1
          fi
          kubectl logs -n "${KUBE_NAMESPACE}" pod/${MIGRATE_NAME}
          kubectl delete pod/${MIGRATE_NAME} -n "${KUBE_NAMESPACE}" --ignore-not-found

      - name: Seed blog posts
        env:
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ env.TAG }}
        run: |
          set -e
          for CMD in seed-ai-support-agent seed-email-to-ticket-automation; do
            POD_NAME="inboxiq-seed-${CMD}-${TAG}"
            cat <<EOF | kubectl apply -f -
            apiVersion: v1
            kind: Pod
            metadata:
              name: ${POD_NAME}
              namespace: ${KUBE_NAMESPACE}
            spec:
              restartPolicy: Never
              containers:
                - name: seed
                  image: ${IMAGE}
                  command: ["/bin/sh","-lc"]
                  args: ["export FLASK_APP=src.manage:app; /usr/src/.venv/bin/python -m flask ${CMD}"]
                  env:
                    - name: APP_ENV
                      value: "production"
                    - name: DATABASE_URL
                      valueFrom:
                        secretKeyRef:
                          name: inboxiq-env
                          key: DATABASE_URL
                  envFrom:
                    - secretRef:
                        name: inboxiq-env
                    - configMapRef:
                        name: inboxiq-config
                  resources:
                    requests:
                      memory: "256Mi"
                      cpu: "100m"
                    limits:
                      memory: "512Mi"
                      cpu: "250m"
          EOF
            if ! kubectl wait --for=jsonpath='{.status.phase}'=Succeeded pod/${POD_NAME} -n "${KUBE_NAMESPACE}" --timeout=120s; then
              kubectl logs -n "${KUBE_NAMESPACE}" pod/${POD_NAME} || true
              kubectl delete pod/${POD_NAME} -n "${KUBE_NAMESPACE}" --ignore-not-found
              exit 1
            fi
            kubectl logs -n "${KUBE_NAMESPACE}" pod/${POD_NAME}
            kubectl delete pod/${POD_NAME} -n "${KUBE_NAMESPACE}" --ignore-not-found
          done

      - name: Deploy to EKS
        env:
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ env.TAG }}
        run: |
          IMAGE="${ECR_REGISTRY}/${ECR_REPO}:${TAG}"
          # Apply full deployment specs (with TAG_VALUE substituted) so env vars,
          # resource limits, and volume mounts are always in sync with the YAML.
          # This prevents drift where kubectl set image was used but env changes
          # (e.g. APP_ENV) were never applied — which causes DevelopmentConfig to
          # be used instead of ProductionConfig, connecting to localhost instead of RDS.
          export TAG_VALUE="${TAG}"
          # Priority classes are cluster-scoped — apply before any deployment that references them
          kubectl apply -f src/k8s/priority-classes.yaml
          envsubst < src/k8s/inboxiq-celery-inbox-worker.yaml     | kubectl apply -f - -n "${KUBE_NAMESPACE}"
          envsubst < src/k8s/inboxiq-celery-inbox-beat.yaml       | kubectl apply -f - -n "${KUBE_NAMESPACE}"
          envsubst < src/k8s/inboxiq-celery-billing-worker.yaml   | kubectl apply -f - -n "${KUBE_NAMESPACE}"
          envsubst < src/k8s/inboxiq-celery-billing-beat.yaml     | kubectl apply -f - -n "${KUBE_NAMESPACE}"
          envsubst < src/k8s/inboxiq-celery-content-worker.yaml   | kubectl apply -f - -n "${KUBE_NAMESPACE}"
          kubectl set image deploy/inboxiq inboxiq="${IMAGE}" -n "${KUBE_NAMESPACE}"
          kubectl scale deploy/inboxiq-celery-inbox-beat    -n "${KUBE_NAMESPACE}" --replicas=1
          kubectl scale deploy/inboxiq-celery-billing-beat  -n "${KUBE_NAMESPACE}" --replicas=1
          for deploy in inboxiq inboxiq-celery-inbox-worker inboxiq-celery-inbox-beat inboxiq-celery-billing-worker inboxiq-celery-billing-beat inboxiq-celery-content-worker; do
            echo "Waiting for rollout: ${deploy}"
            if ! kubectl rollout status "deploy/${deploy}" -n "${KUBE_NAMESPACE}" --timeout=600s; then
              echo "${deploy} rollout failed — leaving cluster on last stable image. Fix forward and redeploy."
              exit 1
            fi
          done

      - name: Post-deploy health check
        run: |
          echo "Checking if pods are healthy..."

          # Check if inboxiq deployment is ready
          if ! kubectl rollout status deployment/inboxiq -n "${KUBE_NAMESPACE}" --timeout=180s; then
            echo "❌ inboxiq deployment failed health checks — leaving cluster on last stable image."
            exit 1
          fi

          for worker in inboxiq-celery-inbox-worker inboxiq-celery-billing-worker inboxiq-celery-content-worker; do
            if ! kubectl rollout status "deployment/${worker}" -n "${KUBE_NAMESPACE}" --timeout=180s; then
              echo "❌ ${worker} deployment failed — leaving cluster on last stable image."
              exit 1
            fi
          done

          echo "✅ All deployments healthy - pods passed readiness probes"

      - name: Smoke test
        run: |
          # Hit every key public route and verify no 5xx responses.
          # Auth-required routes returning 302 → login count as passing.
          # Exits non-zero and fails the deploy if any route returns 5xx.
          python scripts/smoke_test.py "https://kalevent.com"

      - name: Verify deployed images
        run: |
          for deploy in inboxiq inboxiq-celery-inbox-worker inboxiq-celery-inbox-beat inboxiq-celery-billing-worker inboxiq-celery-billing-beat inboxiq-celery-content-worker; do
            echo -n "${deploy}: "
            kubectl get deploy "${deploy}" -n "${KUBE_NAMESPACE}" -o jsonpath='{.spec.template.spec.containers[0].image}'; echo
          done
