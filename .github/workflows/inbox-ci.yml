name: ci-cd

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/inbox-ci.yml'
  pull_request:
    types: [closed]
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/inbox-ci.yml'
  workflow_dispatch:
    inputs:
      run_migrations:
        description: "Force run migrations"
        required: false
        default: "false"

concurrency: inbox

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  ECR_REPO: ${{ secrets.ECR_REPO }}
  EKS_CLUSTER: ${{ secrets.EKS_CLUSTER }}
  KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
  HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'inboxiq')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect migration changes
        id: migrations
        run: |
          set -e
          CHANGED=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.run_migrations }}" = "true" ]; then
              CHANGED=true
            fi
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            DIFF=$(git diff --name-only "$BASE" "$HEAD" -- src/migrations/versions || true)
            if [ -n "$DIFF" ]; then
              CHANGED=true
            fi
          else
            git fetch --no-tags --prune --depth=2 origin "${{ github.ref }}"
            DIFF=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- src/migrations/versions || true)
            if [ -n "$DIFF" ]; then
              CHANGED=true
            fi
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_INBOX }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${ECR_REGISTRY}"

      - name: Verify InboxIQ lockfile
        run: |
          test -s src/requirements-inboxiq.lock.txt

      - name: Build and push image
        run: |
          TAG="$(date +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"
          IMAGE="${ECR_REGISTRY}/${ECR_REPO}:${TAG}"
          docker buildx build \
            --platform linux/amd64 \
            -f src/Dockerfile.inboxiq \
            -t "${IMAGE}" \
            --push \
            .
          # Optional additional tag for convenience
          docker buildx imagetools create -t "${ECR_REGISTRY}/${ECR_REPO}:inbox" "${IMAGE}"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name "${EKS_CLUSTER}" --region "${AWS_REGION}"

      - name: Run migrations
        if: steps.migrations.outputs.changed == 'true'
        env:
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ env.TAG }}
        run: |
          set -e
          MIGRATE_NAME="inboxiq-migrate-${TAG}"
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: ${MIGRATE_NAME}
            namespace: ${KUBE_NAMESPACE}
          spec:
            restartPolicy: Never
            containers:
              - name: migrate
                image: ${IMAGE}
                command: ["/bin/sh","-lc"]
                args: ["export FLASK_APP=src.manage:app; /usr/src/.venv/bin/python -m flask db upgrade -d src/migrations"]
                env:
                  - name: APP_ENV
                    value: "production"
                  - name: DATABASE_URL
                    valueFrom:
                      secretKeyRef:
                        name: inboxiq-env
                        key: DATABASE_URL
                envFrom:
                  - secretRef:
                      name: inboxiq-env
                  - configMapRef:
                      name: inboxiq-config
                resources:
                  requests:
                    memory: "512Mi"
                    cpu: "100m"
                  limits:
                    memory: "1Gi"
                    cpu: "500m"
          EOF
          if ! kubectl wait --for=jsonpath='{.status.phase}'=Succeeded pod/${MIGRATE_NAME} -n "${KUBE_NAMESPACE}" --timeout=600s; then
            kubectl logs -n "${KUBE_NAMESPACE}" pod/${MIGRATE_NAME} || true
            kubectl describe pod -n "${KUBE_NAMESPACE}" ${MIGRATE_NAME} || true
            kubectl delete pod/${MIGRATE_NAME} -n "${KUBE_NAMESPACE}" --ignore-not-found
            exit 1
          fi
          kubectl logs -n "${KUBE_NAMESPACE}" pod/${MIGRATE_NAME}
          kubectl delete pod/${MIGRATE_NAME} -n "${KUBE_NAMESPACE}" --ignore-not-found

      - name: Deploy to EKS
        env:
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ env.TAG }}
        run: |
          IMAGE="${ECR_REGISTRY}/${ECR_REPO}:${TAG}"
          kubectl set image deploy/inboxiq inboxiq="${IMAGE}" -n "${KUBE_NAMESPACE}"
          kubectl set image deploy/inboxiq-celery-inbox-worker inbox-worker="${IMAGE}" -n "${KUBE_NAMESPACE}"
          kubectl set image deploy/inboxiq-celery-inbox-beat inbox-beat="${IMAGE}" -n "${KUBE_NAMESPACE}"
          kubectl scale deploy/inboxiq-celery-inbox-beat -n "${KUBE_NAMESPACE}" --replicas=1
          for deploy in inboxiq inboxiq-celery-inbox-worker inboxiq-celery-inbox-beat; do
            echo "Waiting for rollout: ${deploy}"
            if ! kubectl rollout status "deploy/${deploy}" -n "${KUBE_NAMESPACE}" --timeout=600s; then
              echo "${deploy} rollout failed; rolling back..."
              kubectl rollout undo "deploy/${deploy}" -n "${KUBE_NAMESPACE}" || true
              kubectl rollout status "deploy/${deploy}" -n "${KUBE_NAMESPACE}" --timeout=600s || true
              exit 1
            fi
          done

      - name: Post-deploy health check
        run: |
          if [ -z "${HEALTHCHECK_URL}" ]; then
            echo "HEALTHCHECK_URL not set; skipping."
            exit 0
          fi
          echo "Waiting for service to become healthy..."
          echo "Giving ingress/load balancer 30s to update routing..."
          sleep 30
          for i in {1..15}; do
            if curl -fsS "${HEALTHCHECK_URL}" > /dev/null; then
              echo "✅ Health check passed."
              exit 0
            fi
            echo "Health check attempt ${i} failed; retrying in 15s."
            sleep 15
          done

          echo "❌ Health check failed after retries. Rolling back deployment..."

          # Rollback all deployments
          for deploy in inboxiq inboxiq-celery-inbox-worker inboxiq-celery-inbox-beat; do
            echo "Rolling back ${deploy}..."
            kubectl rollout undo "deploy/${deploy}" -n "${KUBE_NAMESPACE}" || true
            kubectl rollout status "deploy/${deploy}" -n "${KUBE_NAMESPACE}" --timeout=300s || true
          done

          echo "Deployment rolled back to previous version."
          exit 1

      - name: Verify deployed images
        run: |
          kubectl get deploy inboxiq -n "${KUBE_NAMESPACE}" -o jsonpath='{.spec.template.spec.containers[0].image}'; echo
          kubectl get deploy inboxiq-celery-inbox-worker -n "${KUBE_NAMESPACE}" -o jsonpath='{.spec.template.spec.containers[0].image}'; echo
          kubectl get deploy inboxiq-celery-inbox-beat -n "${KUBE_NAMESPACE}" -o jsonpath='{.spec.template.spec.containers[0].image}'; echo
