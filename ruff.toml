target-version = "py311"

[lint]
# Enforcing only rules we've confirmed clean. Expand as we fix more.
# E722 — bare except (catches everything incl. KeyboardInterrupt)
# F821 — undefined name (catches missing imports used in type hints)
select = ["E722", "F821"]

[lint.per-file-ignores]
# Migrations are auto-generated by Alembic; don't lint them.
"src/migrations/*" = ["E722", "F821"]
# Training scripts run outside the app with their own import paths.
"src/dspy/training/*" = ["F821"]
